<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quanta AI - Phishing Detection</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #00d4ff;
      --secondary-color: #0099cc;
      --accent-color: #ff4757;
      --success-color: #2ed573;
      --warning-color: #ffa502;
      --danger-color: #ff3838;
      --bg-primary: #0a0e27;
      --bg-secondary: #1a1f3a;
      --bg-tertiary: #2c3e50;
      --text-primary: #ffffff;
      --text-secondary: #b8c5d6;
      --text-muted: #7f8fa6;
      --border-color: #34495e;
      --shadow-color: rgba(0, 212, 255, 0.1);
      --glow-color: rgba(0, 212, 255, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Navigation */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 1rem 0;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary-color);
      text-decoration: none;
    }

    .logo i {
      font-size: 2rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--primary-color);
    }

    /* Main content */
    .main-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .scan-container {
      background: rgba(26, 31, 58, 0.9);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .logo-icon {
      font-size: 4rem;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
    }

    .title {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .input-section {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .user-input-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .user-input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      transition: all 0.3s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .user-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--shadow-color);
    }

    .user-input::placeholder {
      color: var(--text-muted);
    }

    .clear-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .clear-icon:hover {
      color: var(--primary-color);
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px var(--shadow-color);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-container {
        padding: 0 1rem;
      }
      
      .nav-links {
        gap: 1rem;
      }
      
      .logo {
        font-size: 1.25rem;
      }
      
      .logo i {
        font-size: 1.5rem;
      }
      
      .title {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1.1rem;
      }
      
      .scan-container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="nav-container">
      <a href="/" class="logo">
        <i class="fas fa-shield-alt"></i>
        <span>Quanta AI</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#faqs">FAQs</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <div class="scan-container">
      <div class="logo-icon">
        <i class="fas fa-shield-virus"></i>
      </div>
      <h1 class="title">Phishing Detection</h1>
      <p class="subtitle">Enter a URL below to check if it's a phishing attempt or a legitimate website.</p>
      
      <form action="/check_phishing" method="post" class="input-section">
        <div class="user-input-container">
          <input 
            type="text" 
            class="user-input" 
            id="userInput" 
            name="url" 
            placeholder="https://example.com" 
            autocomplete="off"
            autofocus
            required
          >
          <span class="clear-icon" onclick="clearInput(); event.stopPropagation();">
            <i class="fas fa-times"></i>
          </span>
        </div>
        <button type="submit" class="btn">
          <i class="fas fa-search"></i> Scan URL
        </button>
      </form>
    </div>
  </main>

  <!-- 3D Background Canvas -->
  <div id="canvas-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.5;"></div>

  <script type="module">
    import * as THREE from 'https://threejsfundamentals.org/threejs/resources/threejs/r132/build/three.module.js';

    // Initialize Three.js scene
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Create holographic material
    const holographicMaterial = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 1.0 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        varying vec2 vUv;
        void main() {
          vec2 uv = vUv;
          uv.x += time * 0.1;
          vec3 color = vec3(0.5 + 0.5 * sin(time), 0.5 + 0.5 * cos(time), 1.0);
          vec3 gradientColor = mix(vec3(0.0, 0.0, 0.3), color, uv.y);
          gl_FragColor = vec4(gradientColor, 0.15);
        }
      `,
      transparent: true,
      wireframe: true,
    });

    // Create particles material
    const particleGeometry = new THREE.BufferGeometry();
    const particleCount = 2000;
    const posArray = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 20;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.1,
      color: 0x00d4ff,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const particlesMesh = new THREE.Points(particleGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // Camera position
    camera.position.z = 5;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      // Rotate particles
      particlesMesh.rotation.x += 0.0005;
      particlesMesh.rotation.y += 0.0005;
      
      // Update shader time
      if (holographicMaterial.uniforms) {
        holographicMaterial.uniforms.time.value += 0.01;
      }
      
      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start animation
    animate();

    // Input handling
    function clearInput() {
      const input = document.getElementById('userInput');
      if (input) input.value = '';
    }

    // Make clearInput globally available
    window.clearInput = clearInput;
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth'
            });
          }
        });
      });

      // Handle form submission
      const form = document.querySelector('form');
      if (form) {
        form.addEventListener('submit', function(e) {
          const input = document.getElementById('userInput');
          if (input && !input.value.trim()) {
            e.preventDefault();
            // Add visual feedback for empty input
            input.style.borderColor = 'var(--danger-color)';
            input.placeholder = 'Please enter a URL to scan';
            setTimeout(() => {
              if (input) {
                input.style.borderColor = 'var(--border-color)';
                input.placeholder = 'https://example.com';
              }
            }, 2000);
          }
        });
  navLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();

      const targetId = this.getAttribute('href').substring(1);
      const targetElement = document.getElementById(targetId);

      if (targetElement) {
        // Scroll to the target element smoothly
        targetElement.scrollIntoView({ behavior: 'smooth' });
      }
    });
  });
});

animate();

  </script>
</body>

</html>
