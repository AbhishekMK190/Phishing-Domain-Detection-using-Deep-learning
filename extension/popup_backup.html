<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quanta AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      min-height: 500px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1f2937;
      overflow-x: hidden;
    }
    
    .container {
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .logo {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }
    
    .main-content {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
    }
    
    .status-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    .status-circle.loading {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      animation: pulse 2s ease-in-out infinite;
    }
    
    .status-circle.safe {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    
    .status-circle.warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    
    .status-circle.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      animation: danger-pulse 1.5s ease-in-out infinite;
    }
    
    .status-circle.offline {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes danger-pulse {
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      50% { 
        transform: scale(1.05);
        box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
      }
    }
    
    .status-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    
    .status-text {
      color: white;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      line-height: 1.2;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .domain-info {
      text-align: center;
      margin-bottom: 20px;
      max-width: 100%;
    }
    
    .domain-name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
      word-break: break-all;
    }
    
    .domain-status {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    
    .score-info {
      font-size: 12px;
      color: #9ca3af;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 16px;
    }
    
    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    
    .btn-secondary {
      background: rgba(107, 114, 128, 0.1);
      color: #374151;
      border: 1px solid rgba(107, 114, 128, 0.2);
    }
    
    .btn-secondary:hover {
      background: rgba(107, 114, 128, 0.15);
    }
    
    .footer {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #6b7280;
    }
    
    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    
    .status-dot.offline {
      background: #ef4444;
    }
    
    .cache-info {
      font-size: 10px;
      opacity: 0.7;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      text-align: center;
    }
    
    .error-title {
      font-size: 13px;
      font-weight: 600;
      color: #dc2626;
      margin-bottom: 4px;
    }
    
    .error-detail {
      font-size: 11px;
      color: #7f1d1d;
    }
    
    .settings-link {
      color: #6366f1;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
    }
    
    .settings-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛡️</div>
      <div class="title">Quanta AI</div>
      <div class="subtitle">Real-time Phishing Protection</div>
    </div>
    
    <div class="main-content">
      <div id="statusCircle" class="status-circle loading">
        <div class="spinner"></div>
      </div>
      
      <div class="domain-info">
        <div id="domainName" class="domain-name">Checking current website...</div>
        <div id="domainStatus" class="domain-status">Please wait</div>
        <div id="scoreInfo" class="score-info"></div>
      </div>
      
      <div id="actions" class="actions" style="display: none;">
        <button id="recheckBtn" class="btn btn-secondary">Recheck</button>
        <button id="reportBtn" class="btn btn-primary">Report Issue</button>
      </div>
      
      <div id="errorMessage" class="error-message" style="display: none;">
        <div class="error-title">Connection Error</div>
        <div id="errorDetail" class="error-detail">Unable to connect to Quanta AI API</div>
      </div>
    </div>
    
    <div class="footer">
      <div class="stats">
        <div class="api-status">
          <div id="statusDot" class="status-dot"></div>
          <span id="apiStatusText">API Connected</span>
        </div>
        <div>
          <a href="#" id="settingsLink" class="settings-link">Settings</a>
        </div>
      </div>
      <div id="cacheInfo" class="cache-info"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
