<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quanta AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      min-height: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1f2937;
    }

    .container {
      padding: 16px;
      height: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      color: white;
    }

    .logo {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      opacity: 0.9;
    }

    .main-content {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      min-height: 280px;
    }

    .status-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      font-weight: bold;
    }

    .status-circle.loading {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }

    .status-circle.safe {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .status-circle.warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .status-circle.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    .status-circle.offline {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .domain-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      word-break: break-all;
      color: #1f2937;
    }

    .domain-status {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .score-info {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
    }

    .btn-secondary {
      background: rgba(107, 114, 128, 0.1);
      color: #374151;
      border: 1px solid rgba(107, 114, 128, 0.2);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }

    .error-title {
      font-size: 11px;
      font-weight: 600;
      color: #dc2626;
      margin-bottom: 2px;
    }

    .error-detail {
      font-size: 10px;
      color: #7f1d1d;
    }

    .debug-info {
      font-size: 9px;
      color: #9ca3af;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛡️</div>
      <div class="title">Quanta AI</div>
      <div class="subtitle">Real-time Protection</div>
    </div>

    <div class="main-content">
      <div id="statusCircle" class="status-circle loading">
        <div class="spinner"></div>
      </div>

      <div id="domainName" class="domain-name">Loading...</div>
      <div id="domainStatus" class="domain-status">Checking current website</div>
      <div id="scoreInfo" class="score-info"></div>

      <div id="actions" class="actions" style="display: none;">
        <button id="recheckBtn" class="btn btn-secondary">Recheck</button>
        <button id="reportBtn" class="btn btn-primary">Report</button>
      </div>

      <div id="errorMessage" class="error-message">
        <div class="error-title">Connection Error</div>
        <div id="errorDetail" class="error-detail">Unable to connect to API</div>
      </div>

      <div id="debugInfo" class="debug-info">Debug: Starting...</div>
    </div>

    <div class="footer">
      <div id="apiStatus">Initializing...</div>
    </div>
  </div>

  <script>
    // Debug logging
    const debug = (msg) => {
      console.log('🔍 [Extension Debug]:', msg);
      const debugEl = document.getElementById('debugInfo');
      if (debugEl) {
        debugEl.textContent = `Debug: ${msg}`;
      }
    };

    // DOM elements
    const statusCircle = document.getElementById('statusCircle');
    const domainName = document.getElementById('domainName');
    const domainStatus = document.getElementById('domainStatus');
    const scoreInfo = document.getElementById('scoreInfo');
    const actions = document.getElementById('actions');
    const recheckBtn = document.getElementById('recheckBtn');
    const reportBtn = document.getElementById('reportBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorDetail = document.getElementById('errorDetail');
    const apiStatus = document.getElementById('apiStatus');

    let currentTab = null;

    debug('Popup loaded, starting initialization');

    // Initialize immediately
    setTimeout(init, 100);

    async function init() {
      debug('Initializing popup...');

      try {
        // Set up event listeners
        recheckBtn.addEventListener('click', () => performCheck(true));
        reportBtn.addEventListener('click', () => reportIssue());

        // Get current tab
        await getCurrentTab();

        // Start checking
        await performCheck();

      } catch (error) {
        debug('Init error: ' + error.message);
        showError('Initialization failed: ' + error.message);
      }
    }

    async function getCurrentTab() {
      try {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        currentTab = tab;

        if (tab && tab.url) {
          const domain = extractDomain(tab.url);
          domainName.textContent = domain || 'Unknown domain';
          debug('Current domain: ' + domain);
        }
      } catch (error) {
        debug('Failed to get current tab: ' + error.message);
        domainName.textContent = 'Unable to get domain';
        showError('Unable to access current tab');
      }
    }

    function extractDomain(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return url;
      }
    }

    // DIRECT API CHECK - bypass background script
    async function directApiCheck(domain) {
      debug('Making direct API call to: ' + domain);

      try {
        const response = await fetch('http://127.0.0.1:5000/api/check-fast', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'User-Agent': 'PhishGuard-Extension/2.1'
          },
          body: JSON.stringify({ domain: domain }),
          signal: AbortSignal.timeout(10000)
        });

        debug('API response status: ' + response.status);

        if (response.ok) {
          const data = await response.json();
          debug('API response data: ' + JSON.stringify(data));
          return data;
        } else {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

      } catch (error) {
        debug('API call failed: ' + error.message);
        throw new Error(`API Error: ${error.message}`);
      }
    }

    async function performCheck(force = false) {
      debug('Performing check...');

      if (!currentTab || !currentTab.url) {
        showError('No active tab found');
        return;
      }

      const url = currentTab.url;
      const domain = extractDomain(url);

      debug('Checking domain: ' + domain);

      // Check if URL should be skipped
      if (shouldSkipUrl(url)) {
        showUnsupportedTab();
        return;
      }

      // Show loading state
      showLoading();

      try {
        // Make DIRECT API call (bypass background script)
        debug('Making direct API call...');
        const apiData = await directApiCheck(domain);

        debug('Processing API result: ' + JSON.stringify(apiData));

        // Handle the result
        if (apiData.status === 'ok') {
          const isPhishing = apiData.label === 'phishing';
          const score = parseFloat(apiData.score || 0);

          debug(`Result: ${apiData.label}, Score: ${score}`);

          domainName.textContent = domain;

          if (isPhishing) {
            showDangerResult(score);
          } else if (score > 0.3) {
            showWarningResult(score);
          } else {
            showSafeResult(score);
          }

          actions.style.display = 'flex';
          apiStatus.textContent = 'API Connected ✓';

        } else {
          throw new Error(apiData.detail || 'API returned error status');
        }

      } catch (error) {
        debug('Check error: ' + error.message);
        handleCheckError(error.message);
      }
    }

    function shouldSkipUrl(url) {
      if (!url) return true;

      const skipPatterns = [
        /^chrome:/,
        /^edge:/,
        /^moz-extension:/,
        /^chrome-extension:/,
        /^about:/,
        /^file:/,
        /^data:/
      ];

      return skipPatterns.some(pattern => pattern.test(url));
    }

    function handleCheckError(error) {
      debug('Handling error: ' + error);

      statusCircle.className = 'status-circle offline';
      statusCircle.innerHTML = '⚠️';

      domainStatus.textContent = 'Unable to verify security';
      scoreInfo.textContent = '';

      showError(error);

      apiStatus.textContent = 'API Offline ✗';
      actions.style.display = 'flex';
      reportBtn.textContent = 'Report Problem';
    }

    function showLoading() {
      debug('Showing loading state');
      statusCircle.className = 'status-circle loading';
      statusCircle.innerHTML = '<div class="spinner"></div>';

      domainStatus.textContent = 'Checking security...';
      scoreInfo.textContent = '';
      actions.style.display = 'none';
      hideError();
      apiStatus.textContent = 'Checking...';
    }

    function showSafeResult(score) {
      debug('Showing safe result');
      statusCircle.className = 'status-circle safe';
      statusCircle.innerHTML = '✅';

      domainStatus.textContent = 'This website appears to be safe';
      scoreInfo.textContent = `Risk Score: ${score.toFixed(3)}`;
    }

    function showWarningResult(score) {
      debug('Showing warning result');
      statusCircle.className = 'status-circle warning';
      statusCircle.innerHTML = '⚠️';

      domainStatus.textContent = 'This website has suspicious characteristics';
      scoreInfo.textContent = `Risk Score: ${score.toFixed(3)}`;
    }

    function showDangerResult(score) {
      debug('Showing danger result');
      statusCircle.className = 'status-circle danger';
      statusCircle.innerHTML = '🚨';

      domainStatus.textContent = 'PHISHING DETECTED!';
      scoreInfo.textContent = `Risk Score: ${score.toFixed(3)}`;

      reportBtn.textContent = 'Report False Positive';
    }

    function showUnsupportedTab() {
      debug('Showing unsupported tab');
      statusCircle.className = 'status-circle offline';
      statusCircle.innerHTML = '🚫';

      domainName.textContent = 'System Page';
      domainStatus.textContent = 'This page type is not supported';
      scoreInfo.textContent = '';
      actions.style.display = 'none';
      hideError();
      apiStatus.textContent = 'Page not supported';
    }

    function showError(message) {
      errorMessage.style.display = 'block';
      errorDetail.textContent = message;
    }

    function hideError() {
      errorMessage.style.display = 'none';
    }

    function reportIssue() {
      debug('Reporting issue for: ' + currentTab?.url);

      domainStatus.textContent = 'Thank you for your feedback!';
      reportBtn.textContent = 'Reported ✓';
      reportBtn.disabled = true;

      setTimeout(() => {
        reportBtn.disabled = false;
        reportBtn.textContent = 'Report';
      }, 3000);
    }

    debug('Popup script loaded successfully');
  </script>
</body>
</html>
